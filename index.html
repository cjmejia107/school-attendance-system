<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAS Premium | JavaScript Version</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #0f172a; --sidebar-bg: #1e293b; --accent: #6366f1; --text-main: #f8fafc; --text-muted: #94a3b8; --card-bg: #1e293b; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; margin: 0; }
        
        /* Login UI */
        #loginSection { height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(-45deg, #0f172a, #1e1b4b, #312e81, #0f172a); background-size: 400% 400%; animation: gradientBG 15s ease infinite; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass-login { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 50px 40px; width: 100%; max-width: 420px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .brand-icon { width: 70px; height: 70px; background: linear-gradient(135deg, var(--accent), #8b5cf6); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 20px; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4); }
        .input-group-custom { position: relative; margin-bottom: 20px; }
        .input-group-custom i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        .form-control-custom { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 16px 20px 16px 50px; border-radius: 12px; width: 100%; }
        .btn-login { background: linear-gradient(135deg, var(--accent), #8b5cf6); border: none; width: 100%; padding: 16px; border-radius: 12px; color: white; font-weight: 700; cursor: pointer; }

        /* Dashboard UI */
        #dashboardSection { display: none; }
        .sidebar { height: 100vh; width: 250px; position: fixed; top: 0; left: 0; background: var(--sidebar-bg); padding-top: 20px; border-right: 1px solid #334155; }
        .sidebar h4 { text-align: center; color: white; font-weight: 700; margin-bottom: 30px; }
        .sidebar a { padding: 15px 25px; text-decoration: none; font-size: 15px; color: var(--text-muted); display: block; border-left: 3px solid transparent; cursor: pointer;}
        .sidebar a:hover, .sidebar a.active { color: white; background: rgba(99, 102, 241, 0.1); border-left: 3px solid var(--accent); }
        .sidebar a i { margin-right: 15px; width: 20px; text-align: center; }
        .main-content { margin-left: 250px; padding: 30px; }
        .page-title { font-weight: 700; font-size: 28px; margin-bottom: 30px; color: white; }
        .glass-card { background: var(--card-bg); border-radius: 16px; padding: 20px; border: 1px solid #334155; }
        .icon-box { width: 50px; height: 50px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 15px; }
        .bg-blue { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .bg-purple { background: rgba(168, 85, 247, 0.15); color: #a855f7; }
        .bg-green { background: rgba(34, 197, 94, 0.15); color: #22c55e; }
        .table { color: white; }
        .table thead th { background: #0f172a; color: #94a3b8; border-bottom: 2px solid #334155; }
    </style>
</head>
<body>

    <!-- LOGIN SECTION -->
    <div id="loginSection">
        <div class="glass-login">
            <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
            <h2 class="text-center text-white fw-bold mb-4">SCHOOL ATTENDANCE</h2>
            <form id="loginForm">
                <div class="input-group-custom">
                    <input type="text" id="username" class="form-control-custom" placeholder="Username" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="input-group-custom">
                    <input type="password" id="password" class="form-control-custom" placeholder="Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                <button type="submit" class="btn-login">LOGIN TO SYSTEM <i class="fa-solid fa-arrow-right ms-2"></i></button>
                <p id="loginError" class="text-danger text-center mt-3" style="display:none;">Invalid credentials!</p>
            </form>
        </div>
    </div>

    <!-- DASHBOARD SECTION -->
    <div id="dashboardSection">
        <div class="sidebar">
            <h4><i class="fa-solid fa-layer-group text-primary"></i> SAS Premium</h4>
            <hr style="border-color: #334155;">
            <a onclick="showPage('dashboard')" class="active" id="nav-dashboard"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a onclick="showPage('students')" id="nav-students"><i class="fa-solid fa-user-graduate"></i> Manage Students</a>
            <a href="#" onclick="logout()" style="color: #f87171; position:absolute; bottom: 20px;"><i class="fa-solid fa-power-off"></i> Logout</a>
        </div>

        <div class="main-content">
            <!-- DASHBOARD PAGE -->
            <div id="page-dashboard">
                <h2 class="page-title">Dashboard Overview</h2>
                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="glass-card">
                            <div class="icon-box bg-blue"><i class="fa-solid fa-users"></i></div>
                            <h5>Total Students</h5>
                            <h1 id="totalStudents" class="text-white fw-bold">0</h1>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MANAGE STUDENTS PAGE -->
            <div id="page-students" style="display:none;">
                <h2 class="page-title">Manage Students</h2>
                <div class="glass-card mb-4">
                    <form id="addStudentForm" class="row g-3">
                        <div class="col-md-4"><input type="text" id="firstName" class="form-control" placeholder="First Name" required></div>
                        <div class="col-md-4"><input type="text" id="lastName" class="form-control" placeholder="Last Name" required></div>
                        <div class="col-md-2"><input type="text" id="section" class="form-control" placeholder="Section"></div>
                        <div class="col-md-2"><button type="submit" class="btn btn-primary w-100">Add Student</button></div>
                    </form>
                </div>
                <div class="glass-card">
                    <table class="table table-hover">
                        <thead>
                            <tr><th>Name</th><th>Section</th><th>Action</th></tr>
                        </thead>
                        <tbody id="studentList">
                            <!-- Lalabas dito ang mga students -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- LOGIC PARA SA LOGIN ---
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === 'admin' && pass === '123') {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboardSection').style.display = 'block';
                updateDashboard();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        });

        function logout() {
            document.getElementById('dashboardSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('loginForm').reset();
        }

        // --- LOGIC PARA SA NAVIGATION ---
        function showPage(page) {
            document.getElementById('page-dashboard').style.display = 'none';
            document.getElementById('page-students').style.display = 'none';
            
            document.getElementById('nav-dashboard').classList.remove('active');
            document.getElementById('nav-students').classList.remove('active');

            document.getElementById('page-' + page).style.display = 'block';
            document.getElementById('nav-' + page).classList.add('active');
        }

        // --- LOGIC PARA SA STUDENTS (LocalStorage) ---
        let students = JSON.parse(localStorage.getItem('sas_students')) || [];

        document.getElementById('addStudentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const section = document.getElementById('section').value;

            const newStudent = { id: Date.now(), firstName, lastName, section };
            students.push(newStudent);
            localStorage.setItem('sas_students', JSON.stringify(students));
            
            document.getElementById('addStudentForm').reset();
            renderStudents();
            updateDashboard();
        });

        function deleteStudent(id) {
            if(confirm('Delete this student?')) {
                students = students.filter(s => s.id !== id);
                localStorage.setItem('sas_students', JSON.stringify(students));
                renderStudents();
                updateDashboard();
            }
        }

        function renderStudents() {
            const list = document.getElementById('studentList');
            list.innerHTML = '';
            if (students.length === 0) {
                list.innerHTML = '<tr><td colspan="3" class="text-center text-muted">No students found.</td></tr>';
                return;
            }
            students.forEach(s => {
                list.innerHTML += `<tr>
                    <td>${s.firstName} ${s.lastName}</td>
                    <td>${s.section}</td>
                    <td><button onclick="deleteStudent(${s.id})" class="btn btn-sm btn-danger"><i class="fa-solid fa-trash"></i></button></td>
                </tr>`;
            });
        }

        function updateDashboard() {
            document.getElementById('totalStudents').innerText = students.length;
        }

        // Initialize
        renderStudents();
        updateDashboard();
    </script>
</body>
</html>
