<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAS Premium | School Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --secondary: #8b5cf6; --dark: #0f172a; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--dark); color: white; overflow-x: hidden; }
        .navbar { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); padding: 15px 0; }
        .navbar-brand { font-weight: 700; font-size: 24px; color: white !important; }
        .hero { height: 100vh; display: flex; align-items: center; background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.2), transparent 50%); }
        .hero h1 { font-size: 50px; font-weight: 800; line-height: 1.1; margin-bottom: 20px; }
        .hero h1 span { background: -webkit-linear-gradient(45deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-hero { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 15px 35px; border-radius: 10px; font-weight: 600; font-size: 18px; border: none; text-decoration: none; transition: 0.3s; display: inline-block;}
        .btn-hero:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4); color: white;}
        
        /* Modal Styling for Demo */
        .demo-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); z-index: 9999; justify-content: center; align-items: center; }
        .demo-card { background: #1e293b; padding: 40px; border-radius: 15px; text-align: center; border: 1px solid #334155; max-width: 400px; width: 90%; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-layer-group text-primary"></i> SAS Premium</a>
        </div>
    </nav>
    <section class="hero">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6">
                    <h1>Smart Attendance <br><span>Made Simple.</span></h1>
                    <p class="text-muted mb-4">The modern way to track student attendance. Fast, secure, and designed for the digital age.</p>
                    <!-- Pinalitan natin ang button para mag-open ng modal -->
                    <button onclick="document.getElementById('demoModal').style.display='flex'" class="btn-hero">
                        Access Dashboard <i class="fa-solid fa-arrow-right ms-2"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Demo Modal -->
    <div id="demoModal" class="demo-modal">
        <div class="demo-card">
            <i class="fa-solid fa-circle-check text-success mb-3" style="font-size: 50px;"></i>
            <h3 class="mb-3">System Live</h3>
            <p class="text-muted mb-4">This is a static demo. The full functional system with PHP and Database is running locally via XAMPP and hosted on GitHub.</p>
            <button onclick="document.getElementById('demoModal').style.display='none'" class="btn btn-primary w-100">Close</button>
        </div>
    </div>
</body>
</html>
